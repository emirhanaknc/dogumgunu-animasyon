<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sürpriz</title>
<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        color: white;
        font-family: Arial, sans-serif;
    }

    #startPage {
        text-align: center;
    }

    #startButton {
        background: red;
        color: white;
        padding: 20px 40px;
        font-size: 24px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    #birthdayPage {
        display: none;
        text-align: center;
        font-size: 42px;
        font-weight: bold;
        padding: 20px;
    }

    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background: hsl(calc(360 * var(--hue)), 80%, 60%);
        top: -20px;
        animation: fall 3s linear infinite;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
        }
    }
</style>
</head>
<body>

<!-- Şarkı ekledim, sadece burası eklendi -->
<audio autoplay loop>
    <source src="98ea63e1-7017-436e-81d4-246220b43212.mp3" type="audio/mpeg">
    Tarayıcınız ses dosyasını desteklemiyor.
</audio>

<div id="startPage">
    <button id="startButton">Sürpriz için tıkla 🎉</button>
</div>

<div id="birthdayPage">
    🎉❤️ İYİ Kİ DOĞDUN GÖTÜNÜ YEDİĞİM HAKANIM ❤️🎉
</div>

<script>
    document.getElementById("startButton").onclick = function() {
        document.getElementById("startPage").style.display = "none";
        document.getElementById("birthdayPage").style.display = "block";
        startConfetti();
    };

    function startConfetti() {
        for (let i = 0; i < 150; i++) {
            let c = document.createElement("div");
            c.classList.add("confetti");
            c.style.left = Math.random() * 100 + "vw";
            c.style.setProperty("--hue", Math.random());
            c.style.animationDelay = Math.random() * 3 + "s";
            document.body.appendChild(c);
        }
    }
</script>

</body>
</html>
