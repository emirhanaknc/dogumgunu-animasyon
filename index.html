<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Doğum Günü</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* === 1. SAYFA === */
    #page1 {
        background: black;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #startButton {
        background: red;
        color: white;
        padding: 25px 50px;
        font-size: 28px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        transition: 0.3s;
    }
    #startButton:hover {
        transform: scale(1.1);
    }

    /* === 2. SAYFA === */
    #page2 {
        display: none;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(#ffccff, #ffe6ff);
        text-align: center;
        padding-top: 150px;
    }

    #birthdayText {
        font-size: 40px;
        font-weight: bold;
        color: #ff0066;
        text-shadow: 0 0 10px white;
    }

    /* Konfeti */
    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background: random;
        animation: fall linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
    }
</style>
</head>
<body>

<!-- 1. SAYFA -->
<div id="page1">
    <button id="startButton">🎉 Sürpriz için tıkla 🎉</button>
</div>

<!-- 2. SAYFA -->
<div id="page2">
    <h1 id="birthdayText">
        İYİ Kİ DOĞDUN GÖTÜNÜ YEDİĞİM HAKANIM ❤️🎉
    </h1>
</div>

<script>
    // Sayfa geçişi
    document.getElementById("startButton").onclick = function() {
        document.getElementById("page1").style.display = "none";
        document.getElementById("page2").style.display = "block";
        startConfetti();
    };

    function startConfetti() {
