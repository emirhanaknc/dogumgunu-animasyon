<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Doğum Günü</title>
<style>
    body {
        background: #ffdde1;
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin-top: 40px;
        font-size: 40px;
        color: #b30000;
        animation: fadeIn 2s ease-in-out;
    }

    .balloon {
        position: absolute;
        width: 120px;
        animation: float 3s infinite ease-in-out;
        cursor: pointer;
    }

    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0); }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>
<body>

<h1>İyi ki doğmuşsun götünü yediğim hakanım ❤️🎉</h1>

<img src="https://i.ibb.co/7V0yWZP/red-balloon.png" class="balloon" style="left: 45%; top: 60%;" onclick="explode()">

<script>
function explode() {
    alert("🎉 Balon Patladı! 🎉");
}
</script>

</body>
</html>
