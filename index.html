<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İyi ki Doğdun Hakan!</title>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: Arial, sans-serif;
    }

    /* Balonlar */
    .balloon {
        position: absolute;
        bottom: -150px;
        width: 80px;
        height: 100px;
        background: radial-gradient(circle, #ff4d4d, #cc0000);
        border-radius: 50% 50% 45% 45%;
        animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
    }

    /* Konfeti */
    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background: yellow;
        animation: fall 3s linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(0) rotate(0); }
        100% { transform: translateY(100vh) rotate(360deg); }
    }

    /* Ortadaki kutu */
    .center-box {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: white;
        text-shadow: 2px 2px 5px black;
    }

    .cake {
        font-size: 120px;
    }

    .text {
        font-size: 32px;
        margin-top: 20px;
        font-weight: bold;
    }
</style>
</head>

<body>

<!-- Balonlar -->
<script>
for(let i = 0; i < 12; i++){
    let b = document.createElement("div");
    b.className = "balloon";
    b.style.left = Math.random() * 100 + "vw";
    
    // renkler
    let colors = ["#ff4d4d", "#4da6ff", "#66ff66", "#ffff66", "#ff66cc"];
    b.style.background = "radial-gradient(circle, white, " + colors[Math.floor(Math.random()*colors.length)] + ")";
    
    b.style.animationDuration = (5 + Math.random()*4) + "s";
    document.body.appendChild(b);
}
</script>

<!-- Konfeti -->
<script>
for(let i = 0; i < 40; i++){
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = ["red","blue","yellow","green","purple"][Math.floor(Math.random()*5)];
    c.style.animationDuration = (2 + Math.random()*3) + "s";
    document.body.appendChild(c);
}
</script>

<!-- ORTA YAZI VE PASTA -->
<div class="center-box">
    <div class="cake">🎂</div>
    <div class="text">İyi ki doğdun can dostum Hakan 🎉</div>
</div>

</body>
</html>
